name: Secret Scan (Gitleaks)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: gitleaks-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: sensified-AI-dev/sensified-platform/.github/actions/gitleaks@v1
