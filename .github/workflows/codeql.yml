name: CodeQL

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql:
    uses: sensified-AI-dev/sensified-platform/.github/workflows/reusable-codeql.yml@v1
    permissions:
      actions: read
      contents: read
      security-events: write
